[build-system]
requires = ["setuptools>=82.0.1", "wheel", "setuptools-scm>=8.0"]
build-backend = "setuptools.build_meta"

[project]
name = "bounds-cli"
dynamic = ["version"]
description = "AI-first architecture context for coding agents — verified contracts, CI drift gates, zero-LLM structural validation."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Farzin Shifat", email = "farzinshifat@gmail.com" }]
keywords = [
    "ai", "codebase", "tree-sitter", "architecture",
    "manifest", "validation", "code-graph", "drift-detection",
    "subsystem-boundaries", "contract-enforcement",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Build Tools",
]
dependencies = [
    "click>=8.4.1",
    "PyYAML>=6.0.3",
    "packaging>=23.0",
    "tree-sitter>=0.25.2,<0.26",
    "tree-sitter-python>=0.25.0",
    "tree-sitter-sql>=0.3.11,<0.4",
    "tree-sitter-typescript>=0.23.2",
]

[project.optional-dependencies]
dev = ["pytest>=9.0.3", "pytest-xdist>=3.8.0", "coverage>=7.14.1", "build>=1.5.0", "setuptools-scm>=8.0"]

[project.urls]
Homepage = "https://github.com/Farzin312/bounds"
Repository = "https://github.com/Farzin312/bounds"
Documentation = "https://github.com/Farzin312/bounds#readme"
Changelog = "https://github.com/Farzin312/bounds/blob/main/CHANGELOG.md"
Issues = "https://github.com/Farzin312/bounds/issues"

[project.scripts]
bounds = "bounds.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py310"
line-length = 120
exclude = [
    ".venv",
    ".git",
    "build",
    "dist",
    "tests/fixtures",
]

[tool.ruff.lint]
# Conservative selection: pyflakes (F), a subset of pycodestyle errors (E),
# and import sorting (I). Rules that fire on the current source tree are
# disabled here rather than auto-fixed, so the gate passes without touching
# any .py files. Tighten incrementally as the code is cleaned up.
select = ["E", "F", "I"]
ignore = [
    "E501",  # line-too-long: existing code exceeds 120 cols in places
    "F401",  # unused imports present in current source
    "F541",  # f-string without placeholders present in current source
    "I001",  # import block sorting not yet applied to current source
]

[tool.setuptools_scm]
# Drop the git-hash/date local segment ("+g31f72715d.d20260531") from the version.
# That suffix is noise to users and is rejected by PyPI anyway; a development build then
# reads as a clean, monotonic "0.1.devN" (N = commits since the last tag). Cutting a real
# release (git tag v0.1.0) yields a plain "0.1.0". Versioning stays fully dynamic.
local_scheme = "no-local-version"
