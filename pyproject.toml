[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "compact"
version = "0.1.0"
description = "AI-native codebase understanding via subsystem boundary manifests (zero-LLM structural validation)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Farzin Shifat", email = "farzinshifat@gmail.com" }]
keywords = ["ai", "codebase", "tree-sitter", "architecture", "manifest", "validation"]
dependencies = [
    "click>=8.1",
    "PyYAML>=6",
    "tree-sitter>=0.21,<0.26",
    "tree-sitter-python>=0.21",
    "tree-sitter-typescript>=0.21",
]

[project.optional-dependencies]
dev = ["pytest>=7", "pytest-xdist>=3", "coverage>=7"]

[project.scripts]
compact = "compact.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
