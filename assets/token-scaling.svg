<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" role="img" aria-label="Token-scaling chart: reading source grows with codebase size as O of files, while a Bounds describe contract stays flat near 300 tokens as O of public API">
  <defs>
    <linearGradient id="ts_bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#0a0d12"/>
    </linearGradient>
    <style>
      .c { fill:#e6edf3 } .g { fill:#3fb950 } .b { fill:#58a6ff }
      .y { fill:#d29922 } .dim { fill:#6e7681 } .r { fill:#f85149 }
      .axis { stroke:#30363d; stroke-width:1.5 }
      .grid { stroke:#21262d; stroke-width:1 }
      text { font-size:13px }
    </style>
  </defs>

  <rect width="760" height="360" rx="10" fill="url(#ts_bg)"/>
  <text x="380" y="34" text-anchor="middle" class="c" font-size="15">Token cost as the codebase grows</text>

  <!-- gridlines + axes (plot area: x 90..700, y 70..290) -->
  <line class="grid" x1="90" y1="110" x2="700" y2="110"/>
  <line class="grid" x1="90" y1="170" x2="700" y2="170"/>
  <line class="grid" x1="90" y1="230" x2="700" y2="230"/>
  <line class="axis" x1="90" y1="70" x2="90" y2="290"/>
  <line class="axis" x1="90" y1="290" x2="700" y2="290"/>

  <text x="32" y="180" class="dim" font-size="12" transform="rotate(-90 32 180)" text-anchor="middle">tokens into context →</text>
  <text x="395" y="338" class="dim" font-size="12" text-anchor="middle">codebase size  (small → medium → large)</text>

  <!-- Lines draw in, labels fade in, then the 7s cycle resets and loops so the
       reveal replays whenever a reader scrolls the image into view on GitHub. -->

  <!-- O(files) steep curve -->
  <path d="M 100 282 C 280 270, 400 200, 700 78" fill="none" stroke="#f85149" stroke-width="3" pathLength="1" stroke-dasharray="1" stroke-dashoffset="1">
    <animate attributeName="stroke-dashoffset" values="1;1;0;0;1;1" keyTimes="0;0.029;0.243;0.80;0.88;1" dur="7s" repeatCount="indefinite"/>
  </path>

  <!-- O(public API) flat line -->
  <line x1="100" y1="270" x2="700" y2="268" stroke="#3fb950" stroke-width="3" pathLength="1" stroke-dasharray="1" stroke-dashoffset="1">
    <animate attributeName="stroke-dashoffset" values="1;1;0;0;1;1" keyTimes="0;0.071;0.286;0.80;0.88;1" dur="7s" repeatCount="indefinite"/>
  </line>

  <!-- endpoints + labels fade in after the lines are drawn -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.229;0.300;0.80;0.88;1" dur="7s" repeatCount="indefinite"/>
    <circle cx="100" cy="270" r="3.5" fill="#3fb950"/>
    <circle cx="400" cy="269" r="3.5" fill="#3fb950"/>
    <circle cx="700" cy="268" r="3.5" fill="#3fb950"/>
    <text x="110" y="258" class="g" font-size="13">bounds describe — O(public API)</text>
    <text x="470" y="286" class="y" font-size="11">~300 tokens, flat</text>
  </g>
  <g opacity="0">
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.186;0.257;0.80;0.88;1" dur="7s" repeatCount="indefinite"/>
    <text x="384" y="96" class="r" font-size="13">read source — O(files)</text>
    <text x="384" y="114" class="dim" font-size="11">tens of thousands of tokens</text>
  </g>

  <!-- x ticks -->
  <text x="180" y="307" class="dim" font-size="11" text-anchor="middle">small</text>
  <text x="395" y="307" class="dim" font-size="11" text-anchor="middle">medium</text>
  <text x="610" y="307" class="dim" font-size="11" text-anchor="middle">large</text>
</svg>
