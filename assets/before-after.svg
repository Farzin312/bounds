<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" role="img" aria-label="Agent context before and after Bounds: dozens of source files and thousands of tokens versus one describe call at about 300 verified tokens">
  <defs>
    <linearGradient id="ba_bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#0a0d12"/>
    </linearGradient>
    <style>
      .c { fill:#e6edf3 } .g { fill:#3fb950 } .b { fill:#58a6ff }
      .y { fill:#d29922 } .dim { fill:#6e7681 } .r { fill:#f85149 }
      text { font-size:12px }
    </style>
  </defs>

  <rect width="760" height="300" rx="10" fill="url(#ba_bg)"/>

  <!-- WITHOUT panel -->
  <g transform="translate(20,24)">
    <rect x="0" y="0" width="340" height="252" rx="8" fill="#11161d" stroke="#21262d"/>
    <text x="16" y="28" class="r" font-size="12" font-weight="bold">WITHOUT BOUNDS</text>
    <text x="16" y="50" class="c" font-size="12">agent reads source to guess structure</text>

    <!-- file stack: rows fade in one by one (the slow read) -->
    <g transform="translate(16,66)">
      <g opacity="0"><animate attributeName="opacity" from="0" to="1" dur="0.4s" begin="0.15s" fill="freeze"/>
        <rect x="0" y="0" width="150" height="18" rx="3" fill="#161b22" stroke="#30363d"/><text x="8" y="13" class="dim" font-size="11">auth.ts</text></g>
      <g opacity="0"><animate attributeName="opacity" from="0" to="1" dur="0.4s" begin="0.35s" fill="freeze"/>
        <rect x="0" y="24" width="150" height="18" rx="3" fill="#161b22" stroke="#30363d"/><text x="8" y="37" class="dim" font-size="11">user_repository.ts</text></g>
      <g opacity="0"><animate attributeName="opacity" from="0" to="1" dur="0.4s" begin="0.55s" fill="freeze"/>
        <rect x="0" y="48" width="150" height="18" rx="3" fill="#161b22" stroke="#30363d"/><text x="8" y="61" class="dim" font-size="11">session.ts</text></g>
      <g opacity="0"><animate attributeName="opacity" from="0" to="1" dur="0.4s" begin="0.75s" fill="freeze"/>
        <rect x="0" y="72" width="150" height="18" rx="3" fill="#161b22" stroke="#30363d"/><text x="8" y="85" class="dim" font-size="11">billing.ts</text></g>
      <g opacity="0"><animate attributeName="opacity" from="0" to="1" dur="0.4s" begin="0.95s" fill="freeze"/>
        <rect x="0" y="96" width="150" height="18" rx="3" fill="#161b22" stroke="#30363d"/><text x="8" y="109" class="dim" font-size="11">… 5–15 files</text></g>
    </g>

    <g opacity="0"><animate attributeName="opacity" from="0" to="1" dur="0.4s" begin="1.2s" fill="freeze"/>
      <text x="182" y="104" class="r" font-size="20" font-weight="bold">≈ thousands</text>
      <text x="182" y="124" class="dim" font-size="11">tokens into context</text></g>
    <g opacity="0"><animate attributeName="opacity" from="0" to="1" dur="0.4s" begin="1.35s" fill="freeze"/>
      <text x="16" y="238" class="dim" font-size="11">unverified · grows with codebase</text></g>
  </g>

  <!-- arrow -->
  <g opacity="0"><animate attributeName="opacity" from="0" to="1" dur="0.4s" begin="1.5s" fill="freeze"/>
    <text x="375" y="158" text-anchor="middle" class="b" font-size="26">→</text></g>

  <!-- WITH panel: structure static, content arrives in one beat (the single fast call) -->
  <g transform="translate(400,24)">
    <rect x="0" y="0" width="340" height="252" rx="8" fill="#11161d" stroke="#21262d"/>
    <text x="16" y="28" class="g" font-size="12" font-weight="bold">WITH BOUNDS</text>
    <g opacity="0"><animate attributeName="opacity" from="0" to="1" dur="0.5s" begin="1.75s" fill="freeze"/>
      <text x="16" y="50" class="c" font-size="12">one call returns a verified contract</text>
      <g transform="translate(16,72)">
        <text class="g" font-size="12">$</text><text x="14" class="c" font-size="12">bounds describe auth</text>
      </g>
      <g transform="translate(16,86)">
        <rect x="0" y="0" width="300" height="92" rx="6" fill="#161b22" stroke="#30363d"/>
        <text x="12" y="22" class="dim" font-size="12">{</text>
        <text x="24" y="42" font-size="12"><tspan class="b">"exposes"</tspan><tspan class="dim">: [</tspan><tspan class="c">"login","verify",…</tspan><tspan class="dim">],</tspan></text>
        <text x="24" y="62" font-size="12"><tspan class="b">"verified"</tspan><tspan class="dim">: </tspan><tspan class="g">true</tspan></text>
        <text x="12" y="82" class="dim" font-size="12">}</text>
      </g>
      <text x="16" y="212" class="y" font-size="20" font-weight="bold">≈ 300 tokens</text>
      <text x="16" y="234" class="dim" font-size="11">tree-sitter-verified · flat as code grows</text>
    </g>
  </g>
</svg>
