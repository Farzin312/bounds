<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 320" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" role="img" aria-label="How a coding agent retrieves codebase context: without Bounds it reads many source files for thousands of unverified tokens; with Bounds one describe call returns a tree-sitter-verified contract in a few hundred tokens">
  <defs>
    <linearGradient id="ba_bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#0a0d12"/>
    </linearGradient>
    <style>
      .c { fill:#e6edf3 } .g { fill:#3fb950 } .b { fill:#58a6ff }
      .y { fill:#d29922 } .dim { fill:#6e7681 } .r { fill:#f85149 }
      text { font-size:12px }
    </style>
  </defs>

  <rect width="760" height="320" rx="10" fill="url(#ba_bg)"/>

  <text x="380" y="26" text-anchor="middle" class="c" font-size="13" font-weight="bold">How a coding agent retrieves context</text>
  <text x="380" y="44" text-anchor="middle" class="dim" font-size="11">reading many source files vs one bounds describe call</text>

  <!-- WITHOUT panel -->
  <g transform="translate(20,56)">
    <rect x="0" y="0" width="340" height="252" rx="8" fill="#11161d" stroke="#21262d"/>
    <text x="16" y="28" class="r" font-size="12" font-weight="bold">WITHOUT BOUNDS</text>
    <text x="16" y="50" class="c" font-size="12">agent reads source to guess structure</text>

    <g transform="translate(16,66)">
      <g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.019;0.069;0.81;0.91;1" dur="8s" repeatCount="indefinite"/>
        <rect x="0" y="0" width="150" height="18" rx="3" fill="#161b22" stroke="#30363d"/><text x="8" y="13" class="dim" font-size="11">auth.ts</text></g>
      <g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.044;0.094;0.81;0.91;1" dur="8s" repeatCount="indefinite"/>
        <rect x="0" y="24" width="150" height="18" rx="3" fill="#161b22" stroke="#30363d"/><text x="8" y="37" class="dim" font-size="11">user_repository.ts</text></g>
      <g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.069;0.119;0.81;0.91;1" dur="8s" repeatCount="indefinite"/>
        <rect x="0" y="48" width="150" height="18" rx="3" fill="#161b22" stroke="#30363d"/><text x="8" y="61" class="dim" font-size="11">session.ts</text></g>
      <g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.094;0.144;0.81;0.91;1" dur="8s" repeatCount="indefinite"/>
        <rect x="0" y="72" width="150" height="18" rx="3" fill="#161b22" stroke="#30363d"/><text x="8" y="85" class="dim" font-size="11">billing.ts</text></g>
      <g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.119;0.169;0.81;0.91;1" dur="8s" repeatCount="indefinite"/>
        <rect x="0" y="96" width="150" height="18" rx="3" fill="#161b22" stroke="#30363d"/><text x="8" y="109" class="dim" font-size="11">… 5–15 files</text></g>
    </g>

    <g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.150;0.200;0.81;0.91;1" dur="8s" repeatCount="indefinite"/>
      <text x="182" y="104" class="r" font-size="20" font-weight="bold">≈ thousands</text>
      <text x="182" y="124" class="dim" font-size="11">tokens into context</text></g>
    <g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.169;0.219;0.81;0.91;1" dur="8s" repeatCount="indefinite"/>
      <text x="16" y="238" class="dim" font-size="11">unverified · grows with codebase</text></g>
  </g>

  <!-- arrow -->
  <g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.188;0.238;0.81;0.91;1" dur="8s" repeatCount="indefinite"/>
    <text x="375" y="190" text-anchor="middle" class="b" font-size="26">→</text></g>

  <!-- WITH panel -->
  <g transform="translate(400,56)">
    <rect x="0" y="0" width="340" height="252" rx="8" fill="#11161d" stroke="#21262d"/>
    <text x="16" y="28" class="g" font-size="12" font-weight="bold">WITH BOUNDS</text>
    <g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.219;0.281;0.81;0.91;1" dur="8s" repeatCount="indefinite"/>
      <text x="16" y="50" class="c" font-size="12">one call returns a verified contract</text>
      <g transform="translate(16,72)">
        <text class="g" font-size="12">$</text><text x="14" class="c" font-size="12">bounds describe auth</text>
      </g>
      <g transform="translate(16,86)">
        <rect x="0" y="0" width="300" height="96" rx="6" fill="#161b22" stroke="#30363d"/>
        <text x="12" y="22" font-size="11"><tspan class="dim">{ </tspan><tspan class="b">"exposes"</tspan><tspan class="dim">: [</tspan></text>
        <text x="26" y="44" font-size="11"><tspan class="dim">{</tspan><tspan class="b">"name"</tspan><tspan class="dim">:</tspan><tspan class="c">"login"</tspan><tspan class="dim">,</tspan><tspan class="b">"verified"</tspan><tspan class="dim">:</tspan><tspan class="g">true</tspan><tspan class="dim">}</tspan></text>
        <text x="12" y="66" font-size="11"><tspan class="dim">], </tspan><tspan class="b">"validation_status"</tspan><tspan class="dim">:</tspan></text>
        <text x="26" y="86" font-size="11"><tspan class="g">"fresh"</tspan><tspan class="dim"> }</tspan></text>
      </g>
      <text x="16" y="216" class="y" font-size="18" font-weight="bold">≈ a few hundred tokens</text>
      <text x="16" y="236" class="dim" font-size="11">tree-sitter-verified · O(exposed API)</text>
    </g>
  </g>
</svg>
