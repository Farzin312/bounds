<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 440" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" role="img" aria-label="Bounds CLI demo: install, discover, describe, impact">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#0a0d12"/>
    </linearGradient>
    <style>
      .p { fill:#7d8590 } .c { fill:#e6edf3 } .g { fill:#3fb950 } .b { fill:#58a6ff }
      .y { fill:#d29922 } .m { fill:#bc8cff } .dim { fill:#6e7681 }
      text { font-size:15px }
      .h { font-size:13px; fill:#6e7681 }
    </style>
  </defs>

  <rect width="760" height="440" rx="10" fill="url(#bg)"/>
  <rect width="760" height="34" rx="10" fill="#161b22"/>
  <rect y="24" width="760" height="10" fill="#161b22"/>
  <circle cx="22" cy="17" r="6" fill="#ff5f56"/>
  <circle cx="42" cy="17" r="6" fill="#ffbd2e"/>
  <circle cx="62" cy="17" r="6" fill="#27c93f"/>
  <text x="380" y="22" text-anchor="middle" class="h">bounds — architecture as a token-cheap contract</text>

  <!-- Each line fades in on a slot, holds, then the 12s cycle loops. -->
  <g transform="translate(24,68)">
    <g opacity="1"><animate attributeName="opacity" values="0;1;1;1;1;1;1;0;0" keyTimes="0;0.06;0.2;0.4;0.6;0.8;0.93;0.98;1" dur="12s" repeatCount="indefinite"/>
      <text class="g">$</text><text x="18" class="c">pipx install bounds</text>
    </g>
    <g opacity="1" transform="translate(0,34)"><animate attributeName="opacity" values="0;0;1;1;1;1;1;0;0" keyTimes="0;0.16;0.2;0.4;0.6;0.8;0.93;0.98;1" dur="12s" repeatCount="indefinite"/>
      <text class="g">$</text><text x="18" class="c">bounds discover --apply</text>
      <text x="250" class="dim">› wrote 8 subsystem manifests + root.yaml</text>
    </g>
    <g opacity="1" transform="translate(0,68)"><animate attributeName="opacity" values="0;0;0;1;1;1;1;0;0" keyTimes="0;0.16;0.36;0.4;0.6;0.8;0.93;0.98;1" dur="12s" repeatCount="indefinite"/>
      <text class="g">$</text><text x="18" class="c">bounds describe auth</text>
    </g>
    <g opacity="1" transform="translate(0,98)"><animate attributeName="opacity" values="0;0;0;1;1;1;1;0;0" keyTimes="0;0.16;0.38;0.42;0.6;0.8;0.93;0.98;1" dur="12s" repeatCount="indefinite"/>
      <text x="18" class="dim">{</text>
      <text x="34" y="0"><tspan class="b">"exposes"</tspan><tspan class="dim">: [</tspan><tspan class="c">"login","verify","register"</tspan><tspan class="dim">],</tspan></text>
    </g>
    <g opacity="1" transform="translate(0,122)"><animate attributeName="opacity" values="0;0;0;1;1;1;1;0;0" keyTimes="0;0.16;0.38;0.44;0.6;0.8;0.93;0.98;1" dur="12s" repeatCount="indefinite"/>
      <text x="34"><tspan class="b">"verified"</tspan><tspan class="dim">: </tspan><tspan class="g">true</tspan><tspan class="dim">, </tspan><tspan class="b">"consumed_by"</tspan><tspan class="dim">: [</tspan><tspan class="c">"billing","api"</tspan><tspan class="dim">] }</tspan></text>
      <text x="470" class="y">~300 tokens</text>
    </g>
    <g opacity="1" transform="translate(0,156)"><animate attributeName="opacity" values="0;0;0;0;0;1;1;0;0" keyTimes="0;0.16;0.38;0.5;0.58;0.62;0.93;0.98;1" dur="12s" repeatCount="indefinite"/>
      <text class="g">$</text><text x="18" class="c">bounds impact auth</text>
      <text x="220" class="m">› blast radius: 3 subsystems</text>
    </g>
    <g opacity="1" transform="translate(0,190)"><animate attributeName="opacity" values="0;0;0;0;0;0;1;1;0" keyTimes="0;0.16;0.38;0.5;0.58;0.78;0.82;0.95;1" dur="12s" repeatCount="indefinite"/>
      <text class="g">$</text><text x="18" class="c">bounds validate --quick</text>
      <text x="280" class="g">✓ fresh · 0 drift · 141ms</text>
    </g>
  </g>

  <!-- value strip -->
  <g transform="translate(24,322)">
    <rect x="-4" y="-4" width="712" height="86" rx="8" fill="#11161d" stroke="#21262d"/>
    <text x="12" y="22" class="b">▸</text><text x="30" y="22" class="c" font-size="14">~300 tokens to understand a subsystem</text>
    <text x="30" y="44" class="dim" font-size="12.5">instead of thousands spent reading source — and it stays flat as the codebase grows</text>
    <text x="430" y="22" class="g">▸</text><text x="448" y="22" class="c" font-size="14">zero LLM for the structural path</text>
    <text x="448" y="44" class="dim" font-size="12.5">tree-sitter + pure Python · deterministic · sub-200ms</text>
    <text x="12" y="70" class="m">▸</text><text x="30" y="70" class="dim" font-size="12.5">binary cache = context armor · drift caught on every commit · one command to wire 8 agents</text>
  </g>
</svg>
