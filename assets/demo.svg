<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 404" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" role="img" aria-label="Terminal session: the Bounds CLI describing a subsystem's verified contract, folding Postgres migrations into the live table and row-level-security surface (and self-reporting what it could not parse), showing a change's blast radius, and validating for drift">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#0a0d12"/>
    </linearGradient>
    <style>
      .p { fill:#7d8590 } .c { fill:#e6edf3 } .g { fill:#3fb950 } .b { fill:#58a6ff }
      .y { fill:#d29922 } .m { fill:#bc8cff } .dim { fill:#6e7681 }
      text { font-size:15px }
      .h { font-size:13px; fill:#6e7681 }
      .j { font-size:14px }
    </style>
  </defs>

  <rect width="760" height="404" rx="10" fill="url(#bg)"/>
  <rect width="760" height="34" rx="10" fill="#161b22"/>
  <rect y="24" width="760" height="10" fill="#161b22"/>
  <circle cx="22" cy="17" r="6" fill="#ff5f56"/>
  <circle cx="42" cy="17" r="6" fill="#ffbd2e"/>
  <circle cx="62" cy="17" r="6" fill="#27c93f"/>
  <text x="380" y="22" text-anchor="middle" class="h">Terminal session — bounds CLI · a verified contract, queried not read</text>

  <!-- Each line fades in on a staggered slot, holds, then the 9s cycle loops. -->
  <g transform="translate(24,66)">
    <g opacity="1"><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.04;0.93;1" dur="9s" repeatCount="indefinite"/>
      <text class="g">$</text><text x="18" class="c">bounds describe auth</text>
    </g>
    <g opacity="1" transform="translate(0,28)"><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.13;0.93;1" dur="9s" repeatCount="indefinite"/>
      <text x="18" class="j"><tspan class="b">"exposes"</tspan><tspan class="dim">:[{</tspan><tspan class="b">"name"</tspan><tspan class="dim">:</tspan><tspan class="c">"login"</tspan><tspan class="dim">, </tspan><tspan class="b">"verified"</tspan><tspan class="dim">:</tspan><tspan class="g">true</tspan><tspan class="dim">}], </tspan><tspan class="b">"consumed_by"</tspan><tspan class="dim">:[</tspan><tspan class="c">"billing","api"</tspan><tspan class="dim">]</tspan></text>
    </g>

    <g opacity="1" transform="translate(0,62)"><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.27;0.93;1" dur="9s" repeatCount="indefinite"/>
      <text class="g">$</text><text x="18" class="c">bounds describe db</text><text x="190" class="dim" font-size="13">migrations folded → live surface</text>
    </g>
    <g opacity="1" transform="translate(0,90)"><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.36;0.93;1" dur="9s" repeatCount="indefinite"/>
      <text x="18" class="j"><tspan class="b">"tables"</tspan><tspan class="dim">:114, </tspan><tspan class="b">"rls_posture"</tspan><tspan class="dim">:{</tspan><tspan class="b">"protected"</tspan><tspan class="dim">:</tspan><tspan class="g">110</tspan><tspan class="dim">, </tspan><tspan class="b">"unprotected"</tspan><tspan class="dim">:</tspan><tspan class="y">2</tspan><tspan class="dim">}</tspan></text>
    </g>
    <g opacity="1" transform="translate(0,114)"><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.45;0.93;1" dur="9s" repeatCount="indefinite"/>
      <text x="18" class="j"><tspan class="b">"schema_coverage"</tspan><tspan class="dim">:{</tspan><tspan class="b">"complete"</tspan><tspan class="dim">:</tspan><tspan class="y">false</tspan><tspan class="dim">, </tspan><tspan class="b">"unextracted_files"</tspan><tspan class="dim">:</tspan><tspan class="y">3</tspan><tspan class="dim">}</tspan></text>
    </g>
    <g opacity="1" transform="translate(0,134)"><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.50;0.93;1" dur="9s" repeatCount="indefinite"/>
      <text x="18" class="dim" font-size="12">↳ it tells the agent what it could NOT parse — absence is not authoritative</text>
    </g>

    <g opacity="1" transform="translate(0,166)"><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.64;0.93;1" dur="9s" repeatCount="indefinite"/>
      <text class="g">$</text><text x="18" class="c">bounds impact orders</text><text x="200" class="m">{ "blast_radius": 6 }</text>
      <text x="410" class="dim" font-size="13">— reach, before you edit</text>
    </g>
    <g opacity="1" transform="translate(0,194)"><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.78;0.93;1" dur="9s" repeatCount="indefinite"/>
      <text class="g">$</text><text x="18" class="c">bounds validate --quick</text><text x="232" class="g">{ "ok": true }</text>
      <text x="380" class="dim" font-size="13">— drift fails CI, zero LLM</text>
    </g>
  </g>

  <!-- value strip: three short truthful rows; measured token range + caveats live in the README prose -->
  <g transform="translate(24,312)">
    <rect x="-4" y="-4" width="712" height="80" rx="8" fill="#11161d" stroke="#21262d"/>
    <text x="14" y="22"><tspan class="b">▸ </tspan><tspan class="c" font-size="14">a verified contract in a few hundred tokens</tspan><tspan class="dim" font-size="12">   ·   not source the agent guesses at</tspan></text>
    <text x="14" y="46"><tspan class="m">▸ </tspan><tspan class="c" font-size="14">Postgres tables + RLS posture, from migrations</tspan><tspan class="dim" font-size="12">   ·   self-reports its blind spots</tspan></text>
    <text x="14" y="70"><tspan class="g">▸ </tspan><tspan class="c" font-size="14">zero LLM, deterministic, drift fails CI</tspan><tspan class="dim" font-size="12">   ·   8 agents wired in one command</tspan></text>
  </g>
</svg>
