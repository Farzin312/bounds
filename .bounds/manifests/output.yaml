name: output
role: service
criticality: leaf
description: JSON and human-readable rendering of reports and structured errors, plus
  exit-code mapping.
paths:
- src/bounds/shared/output.py
- src/bounds/shared/io.py
exposes:
- name: emit
  kind: function
- name: emit_loud
  kind: function
- name: read_stdin_json
  kind: function
consumes:
- subsystem: errors
  interfaces:
  - BoundsError
