name: agenthook
role: library
criticality: leaf
description: Claude Code hook integration - idempotent settings sync and fail-open
  event handling with bounded stdin reads so agent sessions never hang.
paths:
- src/bounds/agenthook.py
exposes:
- name: HOOK_COMMAND
  kind: const
- name: merge_settings_hooks
  kind: function
- name: run_hook
  kind: function
- name: settings_path
  kind: function
- name: sync_claude_hooks
  kind: function
consumes:
- subsystem: manifest
