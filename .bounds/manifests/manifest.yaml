name: manifest
role: library
criticality: connector
description: Discovery, loading, and schema validation of root.yaml and subsystem manifest files.
paths:
  - src/bounds/manifest
exposes:
  - { name: find_root, kind: function }
  - { name: load_all, kind: function }
  - { name: load_root, kind: function }
consumes:
  - { subsystem: models, via: models, interfaces: [RootManifest, SubsystemCompact, Issue] }
tests:
  - tests/validate/test_loader.py
