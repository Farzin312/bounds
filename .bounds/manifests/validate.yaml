name: validate
role: service
criticality: connector
description: Validation engine - mode dispatch, cached extraction, reference propagation,
  and the eight full validation checks, with an explicitly partial quick mode.
paths:
- src/bounds/core/validate
exposes:
- name: run
  kind: function
- name: CheckContext
  kind: class
- name: check_cycles
  kind: function
- name: resolve_import
  kind: function
- name: build_consumer_index
  kind: function
- name: transitive_consumers
  kind: function
- name: index_extracts
  kind: function
- name: schema_catalog
  kind: function
- name: SCHEMA_LANGUAGES
  kind: variable
- name: fold_subsystem_objects
  kind: function
- name: hash_schema_catalog
  kind: function
- name: schema_diagnostics
  kind: function
- name: schema_objects
  kind: function
- name: schema_rls_posture
  kind: function
- name: run_preflight
  kind: function
- name: run_validate
  kind: function
- name: run_validate_quick
  kind: function
- name: current_cycle_keys
  kind: function
consumes:
- subsystem: models
  via: models
  interfaces:
  - RootManifest
  - SubsystemCompact
  - ExtractResult
  - Issue
  - ValidationReport
- subsystem: manifest
  via: loader
  interfaces:
  - load_all
- subsystem: extract
  via: extract
  interfaces:
  - get_adapter
  - supported_extensions
  - content_hash
  - is_test_file
  - is_test_symbol
  - is_framework_entry_file
  - strip_ext
- subsystem: cache
  via: store
  interfaces:
  - load_state
  - save_state
  - State
  - FileRecord
- subsystem: gitutil
  via: gitutil
  interfaces:
  - repo_root
  - changed_files
- subsystem: ignore
  interfaces:
  - IgnoreMatcher
  - has_generated_marker
  - load_matcher
- subsystem: shared-api
tests:
- tests/validate
docs:
- docs/coverage.md
