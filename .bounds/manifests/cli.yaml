name: cli
role: service
criticality: connector
description: Click command-line entry point and reusable command services, including
  architecture queries, validation, coverage diagnosis and repair, agent sync, CI
  setup, and deterministic SDD guidance.
paths:
- src/bounds/cli.py
- src/bounds/discover.py
- src/bounds/calibrate.py
- src/bounds/agentsync.py
- src/bounds/ciconfig.py
- src/bounds/_io.py
- src/bounds/coverage.py
- src/bounds/sdd.py
exposes:
- name: main
  kind: function
- name: run_discover
  kind: function
- name: run_calibrate
  kind: function
- name: run_agent
  kind: function
- name: run_ci_install
  kind: function
- name: emit_loud
  kind: function
- name: phase_steps
  kind: function
- name: read_stdin_json
  kind: function
- name: resolve_config
  kind: function
- name: run_coverage
  kind: function
- name: run_fix_coverage
  kind: function
- name: run_sdd
  kind: function
consumes:
- subsystem: manifest
  via: loader
  interfaces:
  - find_root
  - load_all
  - load_root
- subsystem: validate
  via: engine
  interfaces:
  - run
  - CheckContext
  - check_cycles
  - resolve_import
  - build_consumer_index
  - transitive_consumers
  - index_extracts
  - schema_catalog
  - SCHEMA_LANGUAGES
- subsystem: extract
  via: scan
  interfaces:
  - adapter_for_language
  - coverage_has_gap
  - extract_file
  - extract_project
  - get_adapter
  - is_config_file
  - is_framework_entry_file
  - is_test_file
  - is_test_symbol
  - iter_repo_source
  - mapping_coverage
  - resolve_doc_owners
  - resolve_test_owners
  - strip_ext
  - subsystems_with_unsupported_source
  - supported_extensions
  - unsupported_surface_files
- subsystem: cache
  via: store
  interfaces:
  - inspect
  - migrate_json_to_sqlite
  - prune_missing
- subsystem: output
  via: output
  interfaces:
  - emit
- subsystem: ignore
  interfaces:
  - IgnoreMatcher
  - load_matcher
- subsystem: models
  interfaces:
  - RootManifest
  - SubsystemCompact
tests:
- tests/cli
- tests/agent
- tests/discover
docs:
- docs/cli-reference.md
