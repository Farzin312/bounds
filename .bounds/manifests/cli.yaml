name: cli
role: service
criticality: connector
description: Click command-line entry point and reusable command services, including
  architecture queries, validation, coverage diagnosis and repair, agent sync, CI
  setup, and deterministic SDD guidance.
paths:
- src/bounds/cli
- src/bounds/__main__.py
exposes:
- name: main
  kind: function
- name: agent_cmd
  kind: function
- name: cache_cmd
  kind: function
- name: calibrate_cmd
  kind: function
- name: ci_cmd
  kind: function
- name: clean_manifest_path
  kind: function
- name: coverage_cmd
  kind: function
- name: describe_cmd
  kind: function
- name: discover_cmd
  kind: function
- name: edit_cmd
  kind: function
- name: fix_coverage_cmd
  kind: function
- name: guide_cmd
  kind: function
- name: impact_cmd
  kind: function
- name: init_cmd
  kind: function
- name: interactive_human
  kind: function
- name: list_cmd
  kind: function
- name: overview_cmd
  kind: function
- name: preflight_cmd
  kind: function
- name: progress
  kind: function
- name: prompt_agent_selection
  kind: function
- name: require_root
  kind: function
- name: run_wrapped
  kind: function
- name: sdd_cmd
  kind: function
- name: upgrade_check_cmd
  kind: function
- name: upgrade_cmd
  kind: function
- name: validate_cmd
  kind: function
- name: where_cmd
  kind: function
consumes:
- subsystem: manifest
  via: loader
  interfaces:
  - find_root
  - load_all
  - load_root
- subsystem: validate
  via: engine
  interfaces:
  - run
  - CheckContext
  - check_cycles
  - resolve_import
  - build_consumer_index
  - transitive_consumers
  - index_extracts
  - schema_catalog
  - SCHEMA_LANGUAGES
- subsystem: cache
  via: store
  interfaces:
  - inspect
  - migrate_json_to_sqlite
  - prune_missing
- subsystem: output
  via: output
  interfaces:
  - emit
  - emit_loud
- subsystem: agentsync
- subsystem: update_check
- subsystem: core-api
- subsystem: shared-api
tests:
- tests/cli
- tests/agent
- tests/discover
docs:
- docs/cli-reference.md
