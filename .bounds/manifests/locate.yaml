name: locate
role: library
criticality: connector
description: "Symbol- and dependency-location queries backing `bounds where` and `bounds\
  \ impact` \u2014 blast radius from declared consumes edges, optional resolved-import\
  \ verification, and file/symbol lookup. Zero LLM, fresh extraction (never a stale\
  \ cache), sorted output."
paths:
- src/bounds/core/locate.py
exposes:
- name: run_impact
  kind: function
- name: run_where
  kind: function
consumes:
- subsystem: extract
- subsystem: ignore
  interfaces:
  - load_matcher
- subsystem: manifest
- subsystem: validate
  interfaces:
  - index_extracts
  - resolve_import
- subsystem: shared-api
tests:
- tests/cli/test_where_path_arg.py
