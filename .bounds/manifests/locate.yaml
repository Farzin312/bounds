name: locate
role: library
criticality: connector
description: Symbol- and dependency-location queries backing `bounds where` and `bounds impact` — blast radius from declared consumes edges, optional resolved-import verification, and file/symbol lookup. Zero LLM, fresh extraction (never a stale cache), sorted output.
paths:
