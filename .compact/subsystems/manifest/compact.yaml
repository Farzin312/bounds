name: manifest
role: library
criticality: connector
description: Discovery, loading, and schema validation of root.yaml and subsystem compact.yaml manifests.
paths:
  - src/compact/manifest
exposes:
  - { name: find_root, kind: function }
  - { name: load_all, kind: function }
consumes:
  - { subsystem: models, via: models, interfaces: [RootManifest, SubsystemCompact, Issue] }
