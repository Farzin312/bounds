name: Clone counter

# Accumulates an all-time clone count. GitHub's traffic API only exposes the
# last 14 days, so we fetch that window daily and merge per-day rows (deduped by
# date) into a JSON store on the orphan `traffic-data` branch. A Shields.io
# endpoint badge in the README reads the running total live.
#
# Requires a repo secret TRAFFIC_TOKEN with:
#   - fine-grained PAT: Administration=read (traffic) + Contents=write (push), or
#   - classic PAT with `repo` scope.
# The built-in GITHUB_TOKEN cannot read the traffic API reliably.

on:
  schedule:
    - cron: "17 3 * * *" # daily at 03:17 UTC
  workflow_dispatch: {}

# We push with the PAT, not GITHUB_TOKEN, so no write perms needed here.
permissions:
  contents: read

concurrency:
  group: clone-counter
  cancel-in-progress: false

jobs:
  count:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch traffic and update all-time store
        env:
          GH_TOKEN: ${{ secrets.TRAFFIC_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          if [ -z "${GH_TOKEN}" ]; then
            echo "::error::TRAFFIC_TOKEN secret is not set. See workflow header for required scopes."
            exit 1
          fi

          # 1. Pull the last-14-day clone window.
          gh api "repos/${REPO}/traffic/clones" > window.json

          # 2. Check out the data branch, or initialize it on first run.
          AUTH_URL="https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git"
          if git clone --quiet --branch traffic-data --single-branch "${AUTH_URL}" store 2>/dev/null; then
            echo "Loaded existing traffic-data branch."
          else
            echo "traffic-data branch missing; initializing."
            mkdir -p store
            git -C store init --quiet
            git -C store remote add origin "${AUTH_URL}"
            git -C store checkout --quiet --orphan traffic-data
          fi

          # 3. Merge the window into the store, deduped by date.
          python3 - <<'PY'
          import json, pathlib

          store = pathlib.Path("store/clones.json")
          data = json.loads(store.read_text()) if store.exists() else {"days": {}}
          data.setdefault("days", {})

          window = json.load(open("window.json"))
          for row in window.get("clones", []):
              day = row["timestamp"][:10]  # YYYY-MM-DD
              prev = data["days"].get(day, {"count": 0, "uniques": 0})
              # A day's totals only grow until the day closes, then are stable.
              # max() keeps the most complete reading across overlapping windows.
              data["days"][day] = {
                  "count": max(prev["count"], row["count"]),
                  "uniques": max(prev["uniques"], row["uniques"]),
              }

          total = sum(v["count"] for v in data["days"].values())
          uniques = sum(v["uniques"] for v in data["days"].values())
          data["total_clones"] = total
          data["total_uniques"] = uniques

          store.write_text(json.dumps(data, indent=2, sort_keys=True) + "\n")

          # Shields.io endpoint badge payload.
          pathlib.Path("store/clones-badge.json").write_text(
              json.dumps(
                  {
                      "schemaVersion": 1,
                      "label": "clones (all-time)",
                      "message": str(total),
                      "color": "blue",
                  }
              )
              + "\n"
          )
          print(f"total_clones={total} total_uniques={uniques} days_tracked={len(data['days'])}")
          PY

          # 4. Commit and push back to the data branch.
          cd store
          git config user.name "clone-counter[bot]"
          git config user.email "clone-counter@users.noreply.github.com"
          git add clones.json clones-badge.json
          if git diff --cached --quiet; then
            echo "No change in clone totals; nothing to commit."
            exit 0
          fi
          git commit --quiet -m "traffic: update all-time clone count"
          git push --quiet origin HEAD:traffic-data
